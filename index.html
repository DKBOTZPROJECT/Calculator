<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* Calculator Box */
.calculator{
    width:320px;
    background:#111;
    padding:15px;
    border-radius:15px;
    box-shadow:0 0 15px #00ffff55;
}

/* Display */
.display{
    width:100%;
    height:70px;
    background:#000;
    color:#00ffff;
    font-size:2.5em;
    text-align:right;
    border:none;
    border-radius:10px;
    padding:10px;
    margin-bottom:12px;
    box-shadow:inset 0 0 8px #00ffff66;
}

/* Grid Layout */
.buttons{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
}

/* Button Base */
button{
    height:65px;
    font-size:1.5em;
    border:none;
    border-radius:10px;
    cursor:pointer;
    color:#fff;
    background:#222;
    transition:0.2s;
}

/* Numbers */
.num:hover{
    background:#333;
}

/* Operators (right column) */
.op{
    background:#2a0033;
}

.op:hover{
    background:#3a0047;
}

/* Equals */
.equals{
    background:#003300;
}

.equals:hover{
    background:#005500;
}

/* Clear */
.clear{
    background:#330000;
}

.clear:hover{
    background:#550000;
}

/* 0 double width */
.zero{
    grid-column:span 2;
}

/* Mobile */
@media(max-width:400px){
    .calculator{width:95%;}
    button{height:60px;font-size:1.3em;}
    .display{height:65px;font-size:2.2em;}
}
</style>
</head>

<body>

<div class="calculator">

<input type="text" id="display" class="display" disabled>

<div class="buttons">

<!-- Row 1 -->
<button class="clear" onclick="clearDisplay()">C</button>
<button class="op" onclick="append('/')">÷</button>
<button class="op" onclick="append('*')">×</button>
<button class="op" onclick="append('-')">−</button>

<!-- Row 2 -->
<button class="num" onclick="append('7')">7</button>
<button class="num" onclick="append('8')">8</button>
<button class="num" onclick="append('9')">9</button>
<button class="op" onclick="append('+')">+</button>

<!-- Row 3 -->
<button class="num" onclick="append('4')">4</button>
<button class="num" onclick="append('5')">5</button>
<button class="num" onclick="append('6')">6</button>
<button class="equals" onclick="calculate()">=</button>

<!-- Row 4 -->
<button class="num" onclick="append('1')">1</button>
<button class="num" onclick="append('2')">2</button>
<button class="num" onclick="append('3')">3</button>
<button class="num" onclick="append('.')">.</button>

<!-- Row 5 -->
<button class="num zero" onclick="append('0')">0</button>

</div>
</div>

<script>
function append(v){
    document.getElementById("display").value += v;
}

function clearDisplay(){
    document.getElementById("display").value = "";
}

function calculate(){
    let exp = document.getElementById("display").value;
    try{
        if(exp.trim()==="") return;
        document.getElementById("display").value = eval(exp);
    }catch{
        document.getElementById("display").value = "Error";
        setTimeout(clearDisplay,1000);
    }
}
</script>

</body>
</html>
