<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        #calculator {
            background-color: #222;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }
        input {
            width: 100%;
            height: 50px;
            font-size: 2em;
            text-align: right;
            border: none;
            border-radius: 5px;
            margin-bottom: 10px;
            padding: 10px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        button {
            width: 23%;
            height: 60px;
            font-size: 1.5em;
            border: none;
            border-radius: 5px;
            margin: 5px;
            box-shadow: 0 0 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        .neon {
            color: white;
            background-color: #444;
            box-shadow: 0 0 5px cyan, 0 0 10px cyan, 0 0 20px cyan, 0 0 40px cyan, 0 0 80px cyan;
        }
        .neon:hover {
            background-color: #555;
        }
        .operator {
            box-shadow: 0 0 5px magenta, 0 0 10px magenta, 0 0 20px magenta, 0 0 40px magenta;
        }
        .operator:hover {
            background-color: #666;
        }
        #equals {
            background-color: green;
            box-shadow: 0 0 5px pink, 0 0 10px pink, 0 0 20px pink;
        }
        #equals:hover {
            background-color: #005700;
        }
    </style>
</head>
<body>
    <div id="calculator">
        <input type="text" id="display" disabled />
        <div>
            <button class="neon" onclick="appendToDisplay('7')">7</button>
            <button class="neon" onclick="appendToDisplay('8')">8</button>
            <button class="neon" onclick="appendToDisplay('9')">9</button>
            <button class="operator" onclick="appendToDisplay('/')">/</button>
        </div>
        <div>
            <button class="neon" onclick="appendToDisplay('4')">4</button>
            <button class="neon" onclick="appendToDisplay('5')">5</button>
            <button class="neon" onclick="appendToDisplay('6')">6</button>
            <button class="operator" onclick="appendToDisplay('*')">*</button>
        </div>
        <div>
            <button class="neon" onclick="appendToDisplay('1')">1</button>
            <button class="neon" onclick="appendToDisplay('2')">2</button>
            <button class="neon" onclick="appendToDisplay('3')">3</button>
            <button class="operator" onclick="appendToDisplay('-')">-</button>
        </div>
        <div>
            <button class="neon" onclick="appendToDisplay('0')">0</button>
            <button class="operator" onclick="clearDisplay()">C</button>
            <button class="operator" id="equals" onclick="calculateResult()">=</button>
            <button class="operator" onclick="appendToDisplay('+')">+</button>
        </div>
    </div>
    <script>
        function appendToDisplay(value) {
            document.getElementById('display').value += value;
        }
        function clearDisplay() {
            document.getElementById('display').value = '';
        }
        function calculateResult() {
            const expression = document.getElementById('display').value;
            const result = eval(expression);
            document.getElementById('display').value = result;
        }
    </script>
</body>
</html>
